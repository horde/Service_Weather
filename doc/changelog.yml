3.0.0-alpha5:
  api: 3.0.0-alpha5
  state:
    release: alpha
    api: alpha
  date: 2026-03-07
  license:
    identifier: BSD-2-Clause
    uri: https://spdx.org/licenses/BSD-2-Clause.html
  notes: "docs(upgrade): add comprehensive PSR-0 to PSR-4 migration guide\nfeat(facade): add Weather facade and comprehensive documentation\nfeat(providers): add OpenWeatherMap, WeatherAPI.com, and NWS providers\nrefactor(tests): migrate legacy tests to PHPUnit 11/12/13\ntest(weather): add comprehensive test suite for PSR-4 implementation\nfeat(psr4): start Service_Weather PSR-4 conversion - core value objects\nConsolidate code changes from 2.5.4 to 2.5.6\nUpdate metadata and workflows for PHP 8 support\nDevelopment mode for Service_Weather-3.0.0alpha4\nReleased Service_Weather-3.0.0alpha3\nAdd CI job for satis repo update\nEdit Unit Tests\nDevelopment mode for Service_Weather-3.0.0alpha4\nReleased Service_Weather-3.0.0alpha2\nDevelopment mode for Service_Weather-3.0.0alpha3\nReleased Service_Weather-3.0.0alpha1\nComponents updated the package files.\nUpdate supported PHP versions and configuration names.\nUpdate package.xml to get rid of non-existant files\nfix phplint warnings\nStandardize descriptions.\nAdd chomp character.\nRemove wunderground driver now that it's dead.\nUpdate the WWO endpoints, if anyone actuall wants to use these.\nWIP to get OWM weather driver in a useable state.\nCan't use searchLocations here, we need the full array.\nThis was changed to \"appid\".\nEnable PHP 7.3 CI.\nUpdate package definitions.\nFix getting exit code on PHP 7.2+.\npackage.xml must not contain empty <notes> tags.\nCreate CHANGES for all components.\nRegenerate package.xml from changelog.yml.\nBuild changelog.yml from existing changelog(s).\nUpdate .horde.yml with extended information.\nUpdate composer.json.\nEnable 7.2 builds.\nPEAR on 5.6 and 7.0 is fixed.\nUpdate file list\nMove phpunit configuration to base directory.\nIndicate markup language.\nUpdate references to COPYING files.\nUse LICENSE consistently and move to base directory.\nStop flooding #horde channel.\nUse https URLs.\nRemove incorrect links.\nGiving in. No 5.6 or 7.0 for now.\nThis order works.\nInstall all dependencies but PECL extensions.\nHopefully this finally fixes Travis builds now.\nPEAR roles are broken on Travis for these PHP versions.\nAlways discover channel manually, due to Travis bug.\nFix Travis tests.\nAdd Travis configuration and .gitignore files.\nUpdated\nUpdate de translation.\nAdd type parameter to .horde.yml files.\nUpdate composer information.\nUpdated composer definitions.\nUpdate file lists.\nRename horde.yml files.\nUpdate de translation.\nDevelopment mode for Horde_Service_Weather-2.5.5"
